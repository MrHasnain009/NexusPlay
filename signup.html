
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sign Up | NexusPlay</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #0b0c10;
      color: white;
    }

    .field {
      background: #0b0c10;
      border: 1px solid #353740;
      transition: .2s;
    }

    .field:focus-within {
      border-color: #ff2a2a;
    }

    .field input {
      background: transparent;
      outline: none;
      width: 100%;
      min-width: 0;
      color: white;
    }

    .eye-btn {
      flex-shrink: 0;
      cursor: pointer;
      padding: 4px;
      transition: color .2s;
    }

    .eye-btn:hover i {
      color: #ff2a2a;
    }

    .valid {
      color: #4ade80;
    }

    .invalid {
      color: #f87171;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- HEADER -->
  <header
    class="h-20 border-b border-white/10 flex items-center justify-between px-6 md:px-12"
  >
    <a
      href="index.html"
      class="text-xl font-black tracking-widest"
    >
      NEXUS<span class="text-[#ff2a2a]">PLAY</span>
    </a>

    <a
      href="index.html"
      class="text-xs text-gray-400 hover:text-white"
    >
      <i class="fa-solid fa-arrow-left mr-2"></i>
      BACK TO ARENA
    </a>
  </header>

  <!-- MAIN -->
  <main class="flex items-center justify-center px-5 py-12">

    <div class="w-full max-w-md">

      <div class="mb-7">
        <p
          class="text-red-500 text-xs tracking-[.3em] font-bold mb-2"
        >
          NEW PLAYER REGISTRATION
        </p>

        <h1 class="text-3xl font-black">
          JOIN THE
          <span class="text-red-500">ARENA.</span>
        </h1>

        <p class="text-gray-400 text-sm mt-2">
          Create your identity. Start your gaming journey.
        </p>
      </div>

      <div
        class="bg-[#15171d] border border-[#342026] rounded-2xl p-7 md:p-9 shadow-2xl"
      >

        <form id="signupForm" class="space-y-5">

          <!-- USERNAME -->
          <div>
            <label
              for="username"
              class="block text-xs font-bold tracking-widest text-gray-300 mb-2"
            >
              GAMER USERNAME
            </label>

            <div class="field rounded-lg flex items-center gap-3 px-4 py-3.5">

              <i class="fa-solid fa-user-ninja text-gray-500"></i>

              <input
                id="username"
                type="text"
                placeholder="e.g. Shadow_Gamer99"
                minlength="3"
                maxlength="24"
                pattern="[A-Za-z0-9_]+"
                title="Use 3-24 characters: letters, numbers and underscores only"
                required
                autocomplete="username"
                aria-describedby="usernameHint usernameStatus"
              >

              <i
                id="usernameIcon"
                class="fa-solid fa-circle-info text-gray-500"
              ></i>

            </div>

            <p
              id="usernameHint"
              class="text-xs text-gray-400 mt-2 leading-relaxed"
            >
              <i class="fa-solid fa-circle-info mr-1"></i>
              3-24 characters. Only letters (A-Z),
              numbers (0-9) and underscores (_) allowed.
            </p>

            <p
              id="usernameStatus"
              class="text-xs mt-2"
              aria-live="polite"
            ></p>
          </div>

          <!-- EMAIL -->
          <div>
            <label
              for="email"
              class="block text-xs font-bold tracking-widest text-gray-300 mb-2"
            >
              EMAIL ADDRESS
            </label>

            <div class="field rounded-lg flex items-center gap-3 px-4 py-3.5">

              <i class="fa-regular fa-envelope text-gray-500"></i>

              <input
                id="email"
                type="email"
                placeholder="player@example.com"
                required
                autocomplete="email"
              >

            </div>
          </div>

          <!-- PASSWORD -->
          <div>
            <label
              for="password"
              class="block text-xs font-bold tracking-widest text-gray-300 mb-2"
            >
              PASSWORD
            </label>

            <div class="field rounded-lg flex items-center gap-3 px-4 py-3.5">

              <i class="fa-solid fa-lock text-gray-500"></i>

              <input
                id="password"
                type="password"
                minlength="8"
                placeholder="Minimum 8 characters"
                required
                autocomplete="new-password"
              >

              <button
                type="button"
                id="togglePassword"
                class="eye-btn"
                aria-label="Show password"
                aria-pressed="false"
              >
                <i class="fa-regular fa-eye text-gray-500"></i>
              </button>

            </div>

            <p
              id="passwordStatus"
              class="text-xs mt-2 text-gray-400"
              aria-live="polite"
            >
              Use at least 8 characters.
            </p>
          </div>

          <!-- CONFIRM PASSWORD -->
          <div>
            <label
              for="confirmPassword"
              class="block text-xs font-bold tracking-widest text-gray-300 mb-2"
            >
              CONFIRM PASSWORD
            </label>

            <div class="field rounded-lg flex items-center gap-3 px-4 py-3.5">

              <i class="fa-solid fa-shield-halved text-gray-500"></i>

              <input
                id="confirmPassword"
                type="password"
                minlength="8"
                placeholder="Repeat your password"
                required
                autocomplete="new-password"
              >

              <button
                type="button"
                id="toggleConfirmPassword"
                class="eye-btn"
                aria-label="Show confirm password"
                aria-pressed="false"
              >
                <i class="fa-regular fa-eye text-gray-500"></i>
              </button>

            </div>

            <p
              id="confirmStatus"
              class="text-xs mt-2"
              aria-live="polite"
            ></p>
          </div>

          <!-- MESSAGE -->
          <p
            id="message"
            role="status"
            aria-live="polite"
            class="hidden text-sm"
          ></p>

          <!-- SUBMIT -->
          <button
            id="submitBtn"
            type="submit"
            class="w-full bg-[#ff2a2a] hover:bg-red-600 transition py-3.5 rounded-lg text-sm font-extrabold tracking-widest"
          >
            <i class="fa-solid fa-gamepad mr-2"></i>
            CREATE PLAYER ACCOUNT
          </button>

        </form>

        <p class="text-center text-sm text-gray-400 mt-7">
          Already have an account?

          <a
            href="login.html"
            class="text-red-400 font-bold hover:text-red-300"
          >
            Sign In
          </a>
        </p>

      </div>
    </div>
  </main>

  <!-- JAVASCRIPT -->
  <script type="module">

    import { supabase } from "./supabase-config.js";
    import { showMessage } from "./auth.js";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("submitBtn");

    const usernameInput = document.getElementById("username");
    const usernameStatus = document.getElementById("usernameStatus");
    const usernameIcon = document.getElementById("usernameIcon");

    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");

    const passwordStatus = document.getElementById("passwordStatus");
    const confirmStatus = document.getElementById("confirmStatus");

    // --------------------------------
    // PASSWORD SHOW / HIDE
    // --------------------------------

    function setupPasswordToggle(buttonId, inputId) {

      const toggleBtn = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      const icon = toggleBtn.querySelector("i");

      toggleBtn.addEventListener("click", () => {

        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";

        icon.classList.toggle("fa-eye", !isHidden);
        icon.classList.toggle("fa-eye-slash", isHidden);

        toggleBtn.setAttribute(
          "aria-label",
          isHidden ? "Hide password" : "Show password"
        );

        toggleBtn.setAttribute(
          "aria-pressed",
          String(isHidden)
        );

      });
    }

    setupPasswordToggle("togglePassword", "password");

    setupPasswordToggle(
      "toggleConfirmPassword",
      "confirmPassword"
    );

    // --------------------------------
    // USERNAME LIVE VALIDATION
    // --------------------------------

    function validateUsername() {

      const username = usernameInput.value.trim();

      if (username.length === 0) {

        usernameStatus.textContent = "";
        usernameIcon.className =
          "fa-solid fa-circle-info text-gray-500";

        return false;
      }

      if (username.length < 3) {

        usernameStatus.textContent =
          "Username must contain at least 3 characters.";

        usernameStatus.className =
          "text-xs mt-2 invalid";

        usernameIcon.className =
          "fa-solid fa-circle-xmark text-red-400";

        return false;
      }

      if (!/^[A-Za-z0-9_]{3,24}$/.test(username)) {

        usernameStatus.textContent =
          "Only letters, numbers and underscores are allowed.";

        usernameStatus.className =
          "text-xs mt-2 invalid";

        usernameIcon.className =
          "fa-solid fa-circle-xmark text-red-400";

        return false;
      }

      usernameStatus.textContent =
        "✓ Valid username format";

      usernameStatus.className =
        "text-xs mt-2 valid";

      usernameIcon.className =
        "fa-solid fa-circle-check text-green-400";

      return true;
    }

    usernameInput.addEventListener(
      "input",
      validateUsername
    );

    // --------------------------------
    // PASSWORD LIVE VALIDATION
    // --------------------------------

    function validatePassword() {

      const password = passwordInput.value;

      if (!password) {
        passwordStatus.textContent =
          "Use at least 8 characters.";

        passwordStatus.className =
          "text-xs mt-2 text-gray-400";

        return false;
      }

      if (password.length < 8) {

        passwordStatus.textContent =
          "Password must contain at least 8 characters.";

        passwordStatus.className =
          "text-xs mt-2 invalid";

        return false;
      }

      passwordStatus.textContent =
        "✓ Password length is valid";

      passwordStatus.className =
        "text-xs mt-2 valid";

      return true;
    }

    passwordInput.addEventListener("input", () => {
      validatePassword();
      validateConfirmPassword();
    });

    // --------------------------------
    // CONFIRM PASSWORD VALIDATION
    // --------------------------------

    function validateConfirmPassword() {

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!confirmPassword) {

        confirmStatus.textContent = "";
        return false;
      }

      if (password !== confirmPassword) {

        confirmStatus.textContent =
          "Passwords do not match.";

        confirmStatus.className =
          "text-xs mt-2 invalid";

        return false;
      }

      confirmStatus.textContent =
        "✓ Passwords match";

      confirmStatus.className =
        "text-xs mt-2 valid";

      return true;
    }

    confirmInput.addEventListener(
      "input",
      validateConfirmPassword
    );

    // --------------------------------
    // SUPABASE SIGNUP
    // --------------------------------

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const username = usernameInput.value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (!validateUsername()) {

        showMessage(
          "Please enter a valid gamer username.",
          true
        );

        usernameInput.focus();
        return;
      }

      if (!validatePassword()) {

        showMessage(
          "Password must contain at least 8 characters.",
          true
        );

        passwordInput.focus();
        return;
      }

      if (!validateConfirmPassword()) {

        showMessage(
          "Passwords do not match.",
          true
        );

        confirmInput.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "CREATING ACCOUNT...";

      try {

        const { data, error } =
          await supabase.auth.signUp({

            email,
            password,

            options: {
              data: {
                username
              }
            }

          });

        if (error) throw error;

        if (data.session) {

          showMessage(
            "Account created successfully!"
          );

          window.location.href = "index.html";

        } else {

          showMessage(
            "Account request received. Check your email to verify your account."
          );

        }

      } catch (error) {

        showMessage(error.message, true);

      } finally {

        button.disabled = false;

        button.innerHTML = `
          <i class="fa-solid fa-gamepad mr-2"></i>
          CREATE PLAYER ACCOUNT
        `;

      }

    });

  </script>

</body>
</html>
