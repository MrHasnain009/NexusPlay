
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | NexusPlay</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background: #0b0c10;
      color: white;
      font-family: 'Outfit', sans-serif;
    }
    .field {
      background: #0b0c10;
      border: 1px solid #353740;
    }
    .field:focus-within {
      border-color: #ff2a2a;
    }
  </style>
</head>

<body class="min-h-screen">

  <header class="h-20 border-b border-white/10 flex items-center justify-between px-6 md:px-12">
    <a href="index.html" class="text-xl font-black tracking-widest">
      NEXUS<span class="text-[#ff2a2a]">PLAY</span>
    </a>
    <a href="login.html" class="text-xs text-gray-400 hover:text-white">
      BACK TO LOGIN
    </a>
  </header>

  <main class="min-h-[calc(100vh-80px)] flex items-center justify-center px-5 py-12">

    <div class="w-full max-w-md bg-[#15171d] border border-[#342026] rounded-2xl p-8">

      <div class="text-center mb-8">
        <i class="fa-solid fa-shield-halved text-red-500 text-4xl mb-5"></i>

        <h1 class="text-2xl font-extrabold">
          RESET <span class="text-red-500">PASSWORD</span>
        </h1>

        <p class="text-gray-400 text-sm mt-3">
          Set a new password to regain access to your arena.
        </p>
      </div>

      <form id="resetForm" class="space-y-5">

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-2">
            NEW PASSWORD
          </label>
          <div class="field rounded-lg px-4 py-3">
            <input id="newPassword" type="password"
              placeholder="Minimum 8 characters"
              minlength="8" required
              autocomplete="new-password"
              class="w-full bg-transparent outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-300 mb-2">
            CONFIRM NEW PASSWORD
          </label>
          <div class="field rounded-lg px-4 py-3">
            <input id="confirmPassword" type="password"
              placeholder="Repeat new password"
              minlength="8" required
              autocomplete="new-password"
              class="w-full bg-transparent outline-none">
          </div>
        </div>

        <p id="message" role="status" class="text-sm hidden"></p>

        <button id="resetBtn" type="submit" disabled
          class="w-full bg-red-600 hover:bg-red-700 disabled:opacity-50 rounded-lg py-3.5 font-bold text-sm transition">
          UPDATE PASSWORD
        </button>

      </form>

      <a href="login.html"
        class="block text-center text-gray-400 hover:text-red-400 text-sm mt-6">
        Return to Login
      </a>

    </div>
  </main>

  <script type="module">
    import { supabase } from "./supabase-config.js";

    const form = document.getElementById("resetForm");
    const btn = document.getElementById("resetBtn");
    const message = document.getElementById("message");

    let recoveryReady = false;

    function showMessage(text, error = false) {
      message.textContent = text;
      message.classList.remove("hidden", "text-red-400", "text-green-400");
      message.classList.add(error ? "text-red-400" : "text-green-400");
    }

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryReady = true;
        btn.disabled = false;
        showMessage("Recovery link verified. Enter your new password.");
      }
    });

    // Supabase processes the recovery link when the client loads.
    // A regular logged-in session alone must not enable this form.

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!recoveryReady) {
        showMessage("Open a valid password recovery link first.", true);
        return;
      }

      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        showMessage("Passwords do not match.", true);
        return;
      }

      btn.disabled = true;
      btn.textContent = "UPDATING...";

      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        showMessage(error.message, true);
        btn.disabled = false;
        btn.textContent = "UPDATE PASSWORD";
        return;
      }

      showMessage("Password updated successfully! Redirecting...");

      await supabase.auth.signOut();

      window.location.replace("login.html");
    });
  </script>

</body>
</html>
